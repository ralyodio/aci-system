name = "my_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MyProject"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0-rc2"

[[lean_lib]]
name = "MyProject"
# Optimus7 is left out until it is ported to the current Mathlib API.
roots = ["MyProject", "AWM21", "AntaresCategory", "Manifold21", "PhysicsCore"]
