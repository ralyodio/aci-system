name: Lean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain from lean-toolchain, pulls the prebuilt
      # Mathlib cache, then runs `lake build`.
      - uses: leanprover/lean-action@v1
